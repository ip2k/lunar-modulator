name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Checkpoints supersede the previous PR head; keep every main run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python-tests:
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -v

  engines-mit:
    # The GPL switch off (FM1_GPL_MODS=0, engines/Makefile; CLAUDE.md, "The GPL
    # switch"): the MIT/BSD build, the only one a firmware image that links
    # JieLi's libraries may be shared as. It must build and pass every engine,
    # sequencer and simulator test without the GPL modules, whose own tests and
    # parity scenarios skip. Every other job runs with the switch on, its
    # default. tests/test_gpl_switch.py (here and in every full run) builds
    # both and checks that the switch-off build compiles, links and lists
    # nothing GPL.
    name: engines (MIT/BSD build, GPL switch off)
    runs-on: ubuntu-latest
    env:
      FM1_GPL_MODS: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Build with the GPL switch off
        run: |
          make -C engines -j4
          engines/build/fm1-render --build-info
      - name: Engine, sequencer and simulator tests, and the switch's own
        run: >-
          python -m pytest -v tests/test_engine*.py tests/test_seq*.py tests/test_movy*.py
          tests/test_sim*.py tests/test_gpl_switch.py

  modules-default:
    # The build-time module list (FM1_MODULES; engines/modules/catalogue.mk;
    # DEVELOPERS.md, "Choosing the modules"). Every other job builds the full
    # list, its default; this one builds the products with the FM-1's
    # proposed list (engines/modules/default.list), with the GPL switch on and
    # off: fm1-render, the virtual FM-1's harness, and every object the JieLi
    # check compiles, natively. A module whose objects the catalogue leaves
    # incomplete fails to link here. tests/test_module_list.py checks the
    # catalogue against the objects' symbols and a smaller list end to end.
    name: engines (module list ${{ matrix.modules }}, GPL switch ${{ matrix.gpl }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        modules: [default]
        gpl: ["1", "0"]
    env:
      FM1_GPL_MODS: ${{ matrix.gpl }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Build the products with the list
        run: |
          B="$PWD/engines/build-modules"
          M="make -C engines -f Makefile -f ../sim/web/mk/sim.mk -f ../tools/jieli/objects.mk SIM=$PWD/sim/web BUILD=$B FM1_MODULES=${{ matrix.modules }}"
          $M -j4 "$B/fm1-render" "$B/fm1-sim-render" $($M -s print-objs)
          "$B/fm1-render" --build-info
          "$B/fm1-render" --list | python -c "import json,sys; print(' '.join(e['id'] for e in json.load(sys.stdin)))"
          "$B/fm1-render" --engine shapes --note 0:60:100:0.5 --seconds 1 --out "$B/shapes.wav"
      - name: The module list's own tests (they build the full list too)
        run: python -m pytest -v tests/test_module_list.py

  engines-32bit:
    # pi32v2 has 4-byte pointers; build the engines 32-bit and run their tests
    # against that binary to catch pointer-size assumptions (docs/11, engines/).
    name: engines (32-bit build and tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install multilib
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++-multilib
      - name: Build 32-bit
        run: make -C engines CXX=g++ EXTRA="-m32 -msse2 -mfpmath=sse" -j4
      - name: Report instance sizes
        run: |
          file engines/build/fm1-render
          python3 - <<'EOF'
          import json, subprocess
          R = "engines/build/fm1-render"
          for e in json.loads(subprocess.check_output([R, "--list"])):
              kind = e["kind"]
              if kind == "sound":
                  args, key = ["--engine", e["id"]], "instance_bytes"
              elif kind == "midi_fx":   # in front of a sound; the stage's bytes included
                  args, key = ["--engine", "test-sine", "--mfx", "0:" + e["id"]], "mfx_bytes"
              else:
                  args, key = ["--input", "noise", "--fx", e["id"]], "fx_bytes"
              s = json.loads(subprocess.check_output([R, *args, "--seconds", "0.1"]))
              size = s[key][0] if isinstance(s[key], list) else s[key]
              print(f'{e["id"]:12} {kind:9} {size:>8} B')
          EOF
      - run: pip install pytest
      - run: python -m pytest -v tests/test_engine*.py tests/test_seq*.py tests/test_movy*.py
      - name: Virtual FM-1 app layer, 32-bit (sim/web)
        env:
          FM1_SIM_CC: gcc
          FM1_SIM_CXX: g++
          FM1_SIM_EXTRA: -m32 -msse2 -mfpmath=sse
        run: python -m pytest -v tests/test_sim_web.py tests/test_sim_seq.py tests/test_seq_ui.py tests/test_sim_multi.py tests/test_sim_mod.py tests/test_sim_lists.py

  engines-sanitizers:
    # ASan + UBSan over every engine test. Vendored files with documented
    # upstream quirks are exempted one by one in engines/sanitizers/; our own
    # code gets no exemptions. The ignorelist is a clang flag, so clang builds.
    name: engines (ASan + UBSan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build with sanitizers
        run: >-
          make -C engines CC=clang CXX=clang++ OPT=-O1 -j4
          EXTRA="-fsanitize=address,undefined -fno-omit-frame-pointer -g
          -fsanitize-ignorelist=sanitizers/ignorelist.txt"
      - run: pip install pytest
      - name: Engine tests against the sanitizer build
        env:
          UBSAN_OPTIONS: suppressions=${{ github.workspace }}/engines/sanitizers/ubsan.supp:halt_on_error=1:print_stacktrace=1
        run: python -m pytest -v tests/test_engine*.py tests/test_seq*.py tests/test_movy*.py
      - name: Virtual FM-1 app layer under the sanitizers (sim/web)
        env:
          FM1_SIM_CC: clang
          FM1_SIM_CXX: clang++
          FM1_SIM_OPT: -O1
          FM1_SIM_EXTRA: -fsanitize=address,undefined -fno-omit-frame-pointer -g -fsanitize-ignorelist=sanitizers/ignorelist.txt
          UBSAN_OPTIONS: suppressions=${{ github.workspace }}/engines/sanitizers/ubsan.supp:halt_on_error=1:print_stacktrace=1
        run: python -m pytest -v tests/test_sim_web.py tests/test_sim_seq.py tests/test_seq_ui.py tests/test_sim_multi.py tests/test_sim_mod.py tests/test_sim_lists.py tests/test_sim_edit.py

  editor-page-tests:
    # The Advanced editor's page tests (sim/web/test/editor-*.mjs, notes/2026-10-06-web-editor.md §17),
    # against the committed module (sim/web/www/fm1.wasm and meta.json: no native build here), in
    # the Playwright container build-on-aeon.sh uses, pinned to the same version (tests/test_ci_pins.py holds
    # the two to each other). Chromium, Firefox and WebKit run the same five tests; Chromium also runs the
    # page's own tests (screenshot.mjs, files.mjs) and the 30-second storm. Firefox needs an audio device,
    # so a PulseAudio null sink is started. All three also record its monitor
    # for the external-audio checks. A failing run uploads screenshots and reports.
    name: editor page tests (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    env:
      HOME: /root         # a container job sets HOME to /github/home, owned by pwuser, and Firefox will not run as root in another user's home
      PLAYWRIGHT_DIR: /pw
      BROWSER: ${{ matrix.browser }}
      FM1_SCHEDULING_CAPTURE: '1' # resource snapshots; Chromium also records a browser-wide audio trace
      SHOTS: page-test-output/${{ matrix.browser }}      # relative to the repository (inside the container, github.workspace is the host's path)
    steps:
      - uses: actions/checkout@v4
      - name: Playwright and axe-core, as build-on-aeon.sh installs them
        run: |
          mkdir -p /pw && cd /pw
          npm install --no-save --no-audit --no-fund playwright@1.63.0 axe-core@4 >/dev/null
          node -e "console.log('playwright', require('/pw/node_modules/playwright/package.json').version)"
      - name: Isolated audio sink and monitor (also enables Firefox's AudioContext)
        run: |
          apt-get update -qq && apt-get install -y -qq pulseaudio pulseaudio-utils >/dev/null
          # norewinds limits the null sink's idle clock buffer to 50 ms; the
          # default 2 s buffer can stall WebKit after a low-latency stream opens.
          # Evidence: notes/2026-10-09-webkit-audio-lifecycle.md.
          pulseaudio --system -n --disallow-exit --exit-idle-time=-1 \
            --load="module-null-sink sink_name=lunar rate=48000 channels=2 norewinds=1" \
            --load="module-native-protocol-unix auth-anonymous=1 socket=/tmp/pa.sock" -D
          echo "PULSE_SERVER=unix:/tmp/pa.sock" >> "$GITHUB_ENV"
          echo "PULSE_SOURCE=lunar.monitor" >> "$GITHUB_ENV"
      # A pre-browser stall must identify its command instead of consuming
      # the whole browser job with editor-unit's report discarded (#132).
      - name: Panel-follow and scheduling helper tests (node)
        timeout-minutes: 5
        run: |
          node --test sim/web/test/panel-follow.test.mjs sim/web/test/startup-ready.test.mjs sim/web/test/scheduling-capture.test.mjs sim/web/test/playback-timeline.test.mjs
      - name: The editor's data and history against the module (node)
        timeout-minutes: 5
        run: node sim/web/test/editor-unit.mjs sim/web/www
      - name: Worklet startup and restart ordering
        timeout-minutes: 5
        run: node sim/web/test/startup-smoke.mjs sim/web/www "$SHOTS/startup"
      - name: External audio detector and browser loopback
        run: |
          node sim/web/test/audio-analysis-check.mjs
          node sim/web/test/audio-loopback.mjs sim/web/www "$SHOTS/audio" 30
      - name: The editor's page tests
        run: |
          mkdir -p "$SHOTS"
          status=0
          for t in editor-ui editor-reach editor-map editor-v1 info-dialogs; do
            echo "::group::$t ($BROWSER)"
            node "sim/web/test/$t.mjs" sim/web/www "$SHOTS" || status=1
            echo "::endgroup::"
          done
          echo "::group::editor (30-second storm, $BROWSER)"
          node sim/web/test/editor.mjs sim/web/www "$SHOTS" 30 || status=1
          echo "::endgroup::"
          exit $status
      - name: The page's own tests (Chromium resolves made-up host names; only it runs them)
        if: matrix.browser == 'chromium'
        run: |
          status=0
          for t in screenshot files; do
            echo "::group::$t"
            node "sim/web/test/$t.mjs" sim/web/www "$SHOTS" || status=1
            echo "::endgroup::"
          done
          exit $status
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: editor-page-test-output-${{ matrix.browser }}
          path: page-test-output/${{ matrix.browser }}
          retention-days: 14
          if-no-files-found: ignore

  dongle-firmware:
    name: dongle firmware (RP2040 UF2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build gcc-arm-none-eabi \
            libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib build-essential
      - name: Fetch pico-sdk 2.1.1
        run: |
          git clone --depth 1 --branch 2.1.1 https://github.com/raspberrypi/pico-sdk "$HOME/pico-sdk"
          git -C "$HOME/pico-sdk" submodule update --init --depth 1 lib/tinyusb
      - name: Build
        env:
          PICO_SDK_PATH: /home/runner/pico-sdk
        run: |
          cmake -S dongle/firmware -B dongle/firmware/build -G Ninja
          cmake --build dongle/firmware/build
          ls -la dongle/firmware/build/usb_key_dongle.uf2
      - uses: actions/upload-artifact@v4
        with:
          name: usb_key_dongle-uf2
          path: |
            dongle/firmware/build/usb_key_dongle.uf2
            dongle/firmware/build/usb_key_dongle.elf.map

  upstream-fm1-re:
    name: AL-255/FM-1-RE tests on fork branch (${{ matrix.ref }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ref: [main, firmware-images-v15]
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ip2k/FM-1-RE
          ref: ${{ matrix.ref }}
          path: fm1-re
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2t64 || sudo apt-get install -y --no-install-recommends libasound2
      - run: pip install crcmod pyyaml
      - name: Unit tests
        working-directory: fm1-re
        run: python -m unittest discover -s tools/tests -v
      - name: Reproduce the V15 unpack from the committed package
        if: matrix.ref == 'firmware-images-v15'
        working-directory: fm1-re/firmware-images/v15
        run: |
          sha256sum -c SHA256SUMS
          tmp=$(mktemp -d); cp raw_fw/FM-1.fwsc "$tmp/"
          python3 ../../3rd-party/jl-misctools/firmware/fwunpack_newfw.py "$tmp/FM-1.fwsc" > /dev/null
          diff -r "$tmp/FM-1.fwsc_unpack" raw_fw/FM-1.fwsc_unpack && echo "unpack reproduced byte for byte"
