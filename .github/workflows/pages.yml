name: pages

# GitHub Pages: the browser simulator (sim/web/www) at the site's root when it
# is in the tree, the user manual at /manual/ with its PDF. The manual's
# reference tables are generated from the code (tools/manual/build.py), so a
# change to the engines, the sequencer or the simulator rebuilds it too.
#
# Pull requests that touch these paths build everything, PDF included, in
# strict mode and attach the PDF as an artifact; only main deploys. The
# repository's Pages source must be "GitHub Actions" (Settings, Pages).

on:
  push:
    branches: [main]
    paths:
      - "manual/**"
      - "tools/manual/**"
      - "engines/**"
      - "sim/web/**"
      - "assets/**"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "manual/**"
      - "tools/manual/**"
      - "engines/**"
      - "sim/web/**"
      - "assets/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build the site and the manual
    runs-on: ubuntu-24.04
    env:
      # The edition line names the commit the manual was built from: on a pull
      # request the branch head, not the temporary merge commit.
      MANUAL_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: manual/requirements.txt
      - name: Pango and fonts for WeasyPrint
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fonts-ibm-plex
      - run: pip install -r manual/requirements.txt
      - name: Build the engines (the reference tables come from them)
        run: make -C engines -j4
      - name: Build the site, the manual and its PDF
        run: python tools/manual/build.py --site _site --pdf --strict --no-make
      - name: Keep the PDF as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: lunar-modulator-manual-pdf
          path: _site/manual/lunar-modulator-manual.pdf
          if-no-files-found: error
      - name: Package the site for Pages
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
