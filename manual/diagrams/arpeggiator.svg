<svg xmlns='http://www.w3.org/2000/svg' width='588.53' height='500.44' viewBox='-9.63 -20.68 392.36 333.62' role='img'><title>The arpeggiator in the note path</title><desc>A block diagram. The keys and MIDI IN send notes to the current sound&#x27;s arpeggiator, and also to the sequencer, which records them as they were played. The sequencer sends the notes of the tracks routed to the sound to the arpeggiator, each note-on a trig, and its clock: the tempo&#x27;s ticks, Start and Stop. While it is on, the arpeggiator plays the notes held one after another on the sound&#x27;s engine; while it is off, every note, the keys&#x27; and the tracks&#x27;, passes straight through to the engine. A note says that modulation&#x27;s note sources hear the notes the engine plays, the arpeggio included, and that each of the four sounds has an arpeggiator of its own.</desc><rect data-kind='bg' x='-9.63' y='-20.68' width='392.36' height='333.62' fill='#fffaf3'/>
<rect data-kind='group' data-id='sound' x='4' y='88.9' width='173.88' height='188.4' rx='8' fill='#faf4ed' stroke='#797593' stroke-width='1.3'/>
