<svg xmlns='http://www.w3.org/2000/svg' width='628.98' height='453.49' viewBox='-23.6 -20.68 419.32 302.32' role='img'><title>The arpeggiator in the note path</title><desc>A block diagram. The keys and MIDI IN send notes to the current sound&#x27;s arpeggiator, and also to the sequencer, which records them as they were played. The sequencer sends the notes of the tracks routed to the sound to the arpeggiator, each note-on a trig, and its clock: the tempo&#x27;s ticks, Start and Stop. The arpeggiator plays the arpeggio on the sound&#x27;s engine. While the arpeggiator is off, the notes go straight to the engine. A note says that modulation&#x27;s note sources hear the notes the engine plays, the arpeggio included, and that each of the four sounds has an arpeggiator of its own.</desc><rect data-kind='bg' x='-23.6' y='-20.68' width='419.32' height='302.32' fill='#fffaf3'/>
