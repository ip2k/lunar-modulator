<svg xmlns='http://www.w3.org/2000/svg' width='508.57' height='948.83' viewBox='-6 -6 339.05 632.55' role='img'><title>The effect chain</title><desc>A chain from top to bottom. Sound 1, here Macro, feeds its first insert, here Echo, then its second insert, which is empty and passes the sound on, then its level on the Mix page. The mix also takes Sounds 2 to 4, each through its own two inserts and level. The mix feeds master slot M1, here Plate, then M2, empty, then AMP, the level modulation can move. The metronome&#x27;s click joins before the limiter, which keeps the sum below 0.98 of full scale. MASTER, the volume, comes last. Notes beside the chain say that SEL and SELECT swap the two inserts, or the two master effects, with their settings, and that the master effects work on every sound together.</desc><rect data-kind='bg' x='-6' y='-6' width='339.05' height='632.55' fill='#fffaf3'/>
