# One sound's effect chain and the master bus, as fm1_app.c renders them
# (render_sounds: inserts in order, an empty slot skipped, the level skipped at
# 100 %; fm1_app_render: the master slots, AMP, the click, the bus limiter,
# MASTER's gain). No effect has a side-chain input yet (fm1_fx_host.h: the key
# is NULL in this stage), so none is drawn.
title = "The effect chain"
caption = "One sound’s chain and the master bus, with Echo in Sound 1’s first insert and Plate in M1 as an example. An empty slot passes the sound on; the limiter keeps the sum below full scale, and MASTER turns the result down."
alt = "A chain from top to bottom. Sound 1, here Macro, feeds its first insert, here Echo, then its second insert, which is empty and passes the sound on, then its level on the Mix page. The mix also takes Sounds 2 to 4, each through its own two inserts and level. The mix feeds master slot M1, here Plate, then M2, empty, then AMP, the level modulation can move. The metronome's click joins before the limiter, which keeps the sum below 0.98 of full scale. MASTER, the volume, comes last. Notes beside the chain say that SEL and SELECT swap the two inserts, or the two master effects, with their settings, and that the master effects work on every sound together."
legend = []

