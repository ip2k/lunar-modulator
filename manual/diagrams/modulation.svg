<svg xmlns='http://www.w3.org/2000/svg' width='663.49' height='638.18' viewBox='-10 -10 442.33 425.45' role='img'><title>Modulation</title><desc>A block diagram. On the left, three kinds of source: the notes of every sound (VEL, NOTE, RAND, KEY, TRIG, RTRG), one sound&#x27;s notes (S1NOTE to S4RTRG), and the sequencer (CLOCK, BEAT, BAR, RUN, START, SEQ1 to SEQ8, SQV1 to SQV8). They feed the matrix in the middle: 32 cables, each from a source to a destination with an amount and an offset, and on page B a VIA source, a curve, a polarity and off, on or per voice. On the right, the destinations: the parameters of Sounds 1 to 4, their two inserts each, the master effects M1 and M2, and the host&#x27;s pitches and AMP. Below, the rack of eight positions, here LFO1, LFO2, ENV3, ENV4 and CHN5 and three empty ones: the matrix reaches the modules&#x27; parameters and gates, and their outputs come back to the matrix as sources. The rack runs every 32 samples, in cable order; in a loop, the cable that runs up the rack reads a tick late.</desc><rect data-kind='bg' x='-10' y='-10' width='442.33' height='425.45' fill='#fffaf3'/>
