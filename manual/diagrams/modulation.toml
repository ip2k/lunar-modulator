id = "notes"
label = "Notes, every sound"
sub = ["VEL NOTE RAND", "KEY TRIG RTRG"]
col = 0
row = 0

[[node]]
id = "own"
label = "One sound’s notes"
sub = ["S1NOTE … S4RTRG"]
col = 0
row = 1

[[node]]
id = "seq"
label = "Sequencer"
sub = ["CLOCK BEAT BAR", "RUN START", "SEQ1–8 SQV1–8"]
col = 0
row = 2

[[node]]
id = "matrix"
label = "Matrix"
sub = ["32 cables, each", "source → destination", "amount and offset;", "VIA, curve, polarity;", "off, on or per voice"]
col = 1
row = 0
rows = 4
stretch = true
role = "mod"

[[node]]
id = "sounds"
label = "Sounds 1–4"
sub = "engine parameters"
col = 2
row = 0

[[node]]
id = "inserts"
label = "Inserts"
sub = "two on each sound"
col = 2
row = 1

[[node]]
id = "master"
label = "Master effects"
sub = "M1 and M2"
col = 2
row = 2

[[node]]
id = "host"
label = "Host"
sub = ["Pitch, Pitch2–4,", "PitchC; AMP"]
col = 2
row = 3

[[node]]
id = "rack"
shape = "cells"
label = "Rack: 8 positions"
sub = ["each a module of one of sixteen kinds (LFO, ENV, CHN …),", "run every 32 samples, in cable order; in a loop,", "the cable that runs up the rack is a tick late (~)"]
cells = ["LFO1", "LFO2", "ENV3", "ENV4", "CHN5", "", "", ""]
col = 0
row = 4
cols = 3
role = "mod"

