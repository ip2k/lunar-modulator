# The modulation system as engines/include/fm1_mod.h builds it: system
# sources (VEL ... S4RTRG, the sequencer's), 8 rack positions, 32 slots,
# the sinks (sound units, inserts, master slots, HOST), one tick of 32 frames,
# and the planner's rule for loops (mod_plan.c).
title = "Modulation"
caption = "How modulation is wired: the notes, the sequencer and the rack’s modules are sources; the matrix’s 32 cables carry them to the sounds, the effects, the host’s pitches and AMP, or back into the rack."
alt = "A block diagram. On the left, three kinds of source: the notes of every sound (VEL, NOTE, RAND, KEY, TRIG, RTRG), one sound's notes (S1NOTE to S4RTRG), and the sequencer (CLOCK, BEAT, BAR, RUN, START, SEQ1 to SEQ8, SQV1 to SQV8). They feed the matrix in the middle: 32 cables, each from a source to a destination with an amount and an offset, and on page B a VIA source, a curve, a polarity and off, on or per voice. On the right, the destinations: the parameters of Sounds 1 to 4, their two inserts each, the master effects M1 and M2, and the host's pitches and AMP. Below, the rack of eight positions, each holding a module of one of sixteen kinds or nothing, here LFO1, LFO2, ENV3, ENV4 and CHN5 and three empty ones: the matrix reaches the modules' parameters and gates, and their outputs come back to the matrix as sources. The rack runs every 32 samples, in cable order; in a loop, the cable that runs up the rack reads a tick late."

