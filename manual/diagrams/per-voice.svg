<svg xmlns='http://www.w3.org/2000/svg' width='622.35' height='729.9' viewBox='-6 -6 414.9 486.6' role='img'><title>Modulation per voice</title><desc>Three frames, top to bottom. A plain cable: RTRG, the note gate, restarts the one ENV3, whose cable moves Timbre on Sound 1 for every note alike. A cable per voice: three held notes, C3, E3 and G3, each gate their own copy of ENV3, voice 1, 2 and 3, and each copy moves the Timbre of its own note; the rack follows up to twelve voices. Refused: a cable per voice from ENV3 into an effect&#x27;s parameter, into the host&#x27;s AMP, into a parameter every note shares such as Macro&#x27;s LPG, or into a module that cannot run per voice, is refused and marked with a cross.</desc><rect data-kind='bg' x='-6' y='-6' width='414.9' height='486.6' fill='#fffaf3'/>
