# Modulation per voice (docs/16 MG9) as engines/include/fm1_mod.h and
# mod_core.c run it: FM1_MOD_VOICES (12) voices, POLY_OK kinds (Envelope, LFO,
# Chance) copied per voice and gated by their note, VOICE slots into POLY
# parameters through set_param_note; what the planner refuses.
title = "Modulation per voice"
caption = "A plain cable and a cable per voice. A plain cable moves every note alike; a cable per voice gives each note its own copy of the module, started and gated by that note. What one note does cannot go to a place every note shares, so such a cable is refused."
alt = "Three frames, top to bottom. A plain cable: RTRG, the note gate, restarts the one ENV3, whose cable moves Timbre on Sound 1 for every note alike. A cable per voice: three held notes, C3, E3 and G3, each gate their own copy of ENV3, voice 1, 2 and 3, and each copy moves the Timbre of its own note; the rack follows up to twelve voices. Refused: a cable per voice from ENV3 into an effect's parameter, into the host's AMP, into a parameter every note shares such as Macro's LPG, or into a module that cannot run per voice, is refused and marked with a cross."

