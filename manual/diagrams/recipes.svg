<svg xmlns='http://www.w3.org/2000/svg' width='656.26' height='544.54' viewBox='-6 -6 437.51 363.02' role='img'><title>Modulation recipes</title><desc>Four small patches. First, LFO2 into LFO1&#x27;s Rate, and LFO1 into Sound 1&#x27;s pitch: a vibrato whose speed wanders. Second, ENV3 into LFO1&#x27;s Depth, and LFO1 into Sound 1&#x27;s pitch: a vibrato that fades in with each note. Third, ENV3 per voice into the Brightness of FM6 on Sound 2: each note starts bright and darkens on its own. Fourth, a loop: LFO1 into LFO2&#x27;s Rate and LFO2 into LFO1&#x27;s Rate, with LFO1 also into Sound 1&#x27;s Timbre; the cable from LFO2 back up the rack to LFO1 reads its value a tick late.</desc><rect data-kind='bg' x='-6' y='-6' width='437.51' height='363.02' fill='#fffaf3'/>
<rect data-kind='group' data-id='a' x='4' y='4' width='417.51' height='72.55' rx='8' fill='#faf4ed' stroke='#797593' stroke-width='1.3'/>
<text x='12' y='18.39' fill='#464261' font-family='IBM Plex Sans, Helvetica Neue, Arial, sans-serif' font-size='11' font-weight='600' text-anchor='start' data-owner='a'>An LFO into an LFO’s rate: a vibrato that wanders</text>
<rect data-kind='group' data-id='b' x='4' y='90.55' width='417.51' height='72.55' rx='8' fill='#faf4ed' stroke='#797593' stroke-width='1.3'/>
