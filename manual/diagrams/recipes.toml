# Four patches, each made of ordinary matrix cables (engines/include/fm1_mod.h):
# LFO into an LFO's Rate, an envelope into an LFO's Depth, ENV3 per voice into
# FM6's Brightness (a POLY parameter, engines/build/fm1-render --list), and a
# loop between LFO1 and LFO2, whose cable from position 2 to position 1 reads
# a tick late (checked with fm1-render --log-mod: mod_delayed 1).
title = "Modulation recipes"
caption = "Four patches made of cables. A module’s parameters take cables like any other: an LFO can speed another up, an envelope can open an LFO’s depth (its knob at 0), an envelope per voice can shape each FM6 note, and two LFOs can drive each other in a loop."
alt = "Four small patches. First, LFO2 into LFO1's Rate, and LFO1 into Sound 1's pitch: a vibrato whose speed wanders. Second, ENV3 into LFO1's Depth, and LFO1 into Sound 1's pitch: a vibrato that fades in with each note. Third, ENV3 per voice into the Brightness of FM6 on Sound 2: each note starts bright and darkens on its own. Fourth, a loop: LFO1 into LFO2's Rate and LFO2 into LFO1's Rate, with LFO1 also into Sound 1's Timbre; the cable from LFO2 back up the rack to LFO1 reads its value a tick late."
legend = []

