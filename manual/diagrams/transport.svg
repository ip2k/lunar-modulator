<svg xmlns='http://www.w3.org/2000/svg' width='810.03' height='736.2' viewBox='-6 -10 540.02 490.8' role='img'><title>The transport</title><desc>A state diagram. Stopped is where it starts. PLAY/STOP goes to Playing, and from any running state PLAY/STOP goes back to Stopped. Held in SEQ mode, REC enters Step record, and letting go returns to Stopped; PLAY/STOP there starts Playing. REC while stopped starts a one-bar Count-in, with REC blinking fast, which turns into Recording, REC lit, a bar later, or into Playing if REC is pressed again. From Playing, REC records at once into a clip with notes, or into an empty clip waits for the next bar, REC blinking fast, and then records; REC during the wait, or while recording, goes back to Playing. SHIFT with PLAY/STOP restarts, and SHIFT with REC captures into the loop. SHIFT with REC while stopped captures the phrase and starts playing with the tempo shown; SELECT tries another tempo, and any press, PLAY/STOP included, only closes it, back to Playing. PLAY/STOP in Step record leaves it and starts Playing.</desc><rect data-kind='bg' x='-6' y='-10' width='540.02' height='490.8' fill='#fffaf3'/>
