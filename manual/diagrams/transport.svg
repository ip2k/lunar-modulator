<svg xmlns='http://www.w3.org/2000/svg' width='785.28' height='780.41' viewBox='-6 -10 523.52 520.27' role='img'><title>The transport</title><desc>A state diagram. Stopped is where it starts. PLAY/STOP, or a slot or a scene launched in Session, goes to Playing, and from any running state PLAY/STOP goes back to Stopped, as does the end of a song set to Stop. Held in SEQ mode, REC enters Step record, and letting go returns to Stopped; PLAY/STOP there starts Playing. REC while stopped starts a one-bar Count-in, with REC blinking fast, which turns into Recording, REC lit, a bar later, or into Playing if REC is pressed again. From Playing, REC records at once into a clip with notes, or into an empty clip waits for the next bar, REC blinking fast, and then records; REC during the wait, or while recording, goes back to Playing. SHIFT with PLAY/STOP restarts, and SHIFT with REC captures into the loop. SHIFT with REC while stopped captures the phrase and starts playing with the tempo shown; SELECT tries another tempo, and any press, PLAY/STOP included, only closes it, back to Playing. PLAY/STOP in Step record leaves it and starts Playing.</desc><rect data-kind='bg' x='-6' y='-10' width='523.52' height='520.27' fill='#fffaf3'/>
