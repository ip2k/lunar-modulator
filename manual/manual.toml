# The Lunar Modulator user manual: what tools/manual/build.py reads.
# manual/README.md explains the sources, the build and the Markdown additions.

title = "Lunar Modulator"
tagline = "INTERGALACTIC MODULATION STATION"
descriptor = "Open firmware for the M-VAVE FM-1"
document = "User Manual"
repository = "https://github.com/ip2k/lunar-modulator"
site_url = "https://ip2k.github.io/lunar-modulator/"
pdf_name = "lunar-modulator-manual.pdf"

# Page size of the PDF. A5 is the size of a booklet in the box; "A4" and
# "letter" also work.
paper = "A5"

# Chapters in order. `features = true` marks a chapter that describes
# functions: every `##` section in it must say where the function runs today
# with a {{status ...}} line (the build checks; manual/README.md, "Honesty").
[[chapter]]
file = "01-welcome-and-safety.md"
summary = "What Lunar Modulator is, what you can use today, and the current limits of recovery and device work."

[[chapter]]
file = "02-getting-started.md"
summary = "Play the browser simulator, render sounds with the desktop tools, and what runs on the device."

[[chapter]]
file = "03-panel-tour.md"
summary = "Every knob, button, key and connector, and what Lunar Modulator does with it."
features = true

[[chapter]]
file = "04-playing.md"
summary = "Keys and voices, velocity, octave and transpose, pitch bend, MIDI input and the arpeggiator."
features = true

[[chapter]]
file = "05-sound-engines.md"
summary = "Macro, Macro Heavy, Six-Op FM, FM6, Shapes, Sophie, Drums, Acid Bass, Comet Kit, Crater Kit, Drawbar, Trio, Phase Bend and Test Sine, with every parameter, and four sounds at once."
features = true

[[chapter]]
file = "06-effects.md"
summary = "Every effect, two inserts on each sound and two on the master bus, the mix, the memory meter and the limiter."
features = true

[[chapter]]
file = "07-sequencer.md"
summary = "Steps, parameter locks, conditions, swing, clips, scenes, recording, Capture, tracks and routing."
features = true

[[chapter]]
file = "08-modulation.md"
summary = "The rack of LFOs, envelopes and other modules, the cables, and the gesture that makes them."
features = true

[[chapter]]
file = "09-midi.md"
summary = "What Lunar Modulator receives and sends over MIDI."
features = true

[[chapter]]
file = "10-settings-and-storage.md"
summary = "The global page, and how sounds and patterns are kept."
features = true

[[chapter]]
file = "11-updating-and-recovery.md"
summary = "Why nothing is installed yet, the recovery dongle, and the firmware your FM-1 has now."

[[chapter]]
file = "12-troubleshooting.md"
summary = "Symptoms and remedies for the simulator and the desktop tools."

[[chapter]]
file = "13-specifications.md"
summary = "The instrument and the firmware in figures."

[[chapter]]
file = "14-credits-and-licences.md"
summary = "Whose work Lunar Modulator builds on, and the terms."

[[chapter]]
file = "15-the-advanced-editor.md"
summary = "The editor in the browser simulator: the flow, sounds and effects, the modulation table and its patch-bay Map, files, memory and undo, and how to reach it by keyboard and on a phone."
features = true

# Back matter: unnumbered, after the chapters.
[[backmatter]]
file = "glossary.md"
summary = "The terms this manual uses."

[[backmatter]]
file = "index-of-controls.md"
summary = "Every control, with the sections that describe it."

# The panel's printed names, as [[NAME]] in the text (manual/README.md). The
# build refuses a name that is not listed here, so a typo cannot slip into
# the index of controls. Names and positions: sim/web (the virtual FM-1) and
# docs/01 §3; the printed names come from M-VAVE's manual [reported].
[controls]
encoders = ["SELECT", "PRESETS", "ALGORITHM", "KNOB1", "KNOB2", "KNOB3", "KNOB4"]
potentiometers = ["MASTER"]
buttons = ["OCT-", "OCT+", "FX", "SEL", "ENV", "LFO", "EDIT", "GLO", "HOME", "SAVE",
           "ARP", "SEQ", "PLAY/STOP", "REC"]
key_labels = ["OP1", "OP2", "OP3", "OP4", "OP5", "OP6", "PIT", "MONO", "POLY"]
connectors = ["POWER", "USB", "MIDI IN", "OUT"]
# Sequencer functions still to be given a key (docs/13 §4, docs/15 §3.4):
# written [[role:LOOP]], drawn with a dashed outline, and indexed apart from
# the printed controls. SHIFT (SEL), CLEAR (OP5) and MUTE (OP6) have theirs
# since the simulator's sequencer went public (2026-10-05).
roles = ["COPY", "LOOP", "SESSION", "UNDO"]

# The panel tour's section for each group of controls: the index of controls
# always lists it under every control in the group.
[control_home]
encoders = "03-panel-tour#knobs"
potentiometers = "03-panel-tour#knobs"
buttons = "03-panel-tour#buttons"
key_labels = "03-panel-tour#keys"
connectors = "03-panel-tour#connections"
