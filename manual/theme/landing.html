<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>$manual_title</title>
<meta name="description" content="$manual_title, $descriptor_lc. $tagline.">
$font_link<link rel="stylesheet" href="manual/assets/manual.css">
<link rel="icon" href="manual/assets/icon.svg" type="image/svg+xml">
</head>
<body class="cover-page">
$hero
<main class="cover-body" id="content">
  <h1 class="cover-title">$manual_title</h1>
  <p class="cover-tagline">$tagline</p>
  <p class="cover-descriptor">$descriptor</p>
  <p>The browser simulator is not published from this build yet. The user manual is:</p>
  <div class="cover-actions">
    <a class="button primary" href="manual/">Read the user manual</a>
    <a class="button" href="manual/$pdf_name">Download the PDF</a>
    <a class="button" href="$repository">Source code</a>
  </div>
  <p class="edition">$edition</p>
</main>
</body>
</html>
